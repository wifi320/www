<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 48px 40px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            border: 1px solid #e9edf2;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1a33;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 16px;
            line-height: 1.7;
            color: #475569;
            margin-bottom: 16px;
        }
        .badge {
            display: inline-block;
            background: #e6f7e6;
            color: #0b6e2e;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 40px;
            margin-top: 8px;
            border: 1px solid #b8e0b8;
        }
        hr {
            border: none;
            border-top: 1px solid #e9edf2;
            margin: 28px 0 20px;
        }
        .footer {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚧 Site Under Maintenance</h1>
        <p>
            This domain is currently being set up or undergoing routine maintenance.
            <br>.
        </p>
        <p style="font-size:15px; color:#1e293b;">
            We apologize for any inconvenience and appreciate your patience.
        </p>
        <div class="badge">✓ Clean &amp; Secure</div>
        <hr>
        <div class="footer">
            This is a placeholder page. The website will be available shortly.
        </div>
    </div>
</body>
</html>
